# peppers-agent Kubernetes Deployment — ADR-0009, Spec 018
# Build context: repo root
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peppers-agent
  labels:
    app: peppers-agent
    tier: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peppers-agent
  template:
    metadata:
      labels:
        app: peppers-agent
        tier: ghost
    spec:
      containers:
        - name: peppers-agent
          image: us-central1-docker.pkg.dev/aie-matrix/aie-matrix/peppers-agent:${IMAGE_TAG}
          ports:
            - containerPort: 4002
          env:
            # Agent-host ClusterIP service URL
            - name: AGENT_HOST_URL
              value: "http://agent-host:4000"
            # Token from the shared cluster secret (same value as agent-host's AGENT_HOST_TOKEN)
            - name: AGENT_HOST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aie-matrix-secrets
                  key: AGENT_HOST_TOKEN
            - name: PEPPERS_AGENT_PORT
              value: "4002"
            # Pod IP via downward API — each replica gets a unique URL
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PEPPERS_AGENT_PUBLIC_BASE_URL
              value: "http://$(MY_POD_IP):4002"
            # Pod name via downward API — becomes unique agentId suffix
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Autospawn roster size (spec 032). The agent-host spawns this many
            # peppers ghosts into the active session. Each runs an LLM cascade
            # per tick — raise deliberately. Mirrors RANDOM_AGENT_COUNT.
            - name: PEPPERS_AGENT_COUNT
              value: "3"
            # LLM: all OpenAI-shaped calls route through OpenRouter (one key,
            # one endpoint). OPENAI_API_KEY is set to the SAME OpenRouter key.
            - name: OPEN_ROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aie-matrix-secrets
                  key: OPEN_ROUTER_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aie-matrix-secrets
                  key: OPEN_ROUTER_API_KEY
            - name: OPENAI_BASE_URL
              value: "https://openrouter.ai/api/v1"
            # Model routing (the production set chosen by the coherence eval).
            - name: PEPPERS_ROUTER
              value: "free-first"
            - name: PEPPERS_ROUTER_PREFER
              value: "nvidia/nemotron-3-super-120b-a12b:free,openai/gpt-oss-120b:free"
            - name: PEPPERS_ID_MODEL
              value: "inclusionai/ling-2.6-flash"
            - name: PEPPERS_SPEECH_MODEL
              value: "meta-llama/llama-3.1-8b-instruct"
            - name: PEPPERS_ROUTER_QUALITY_MODEL
              value: "anthropic/claude-haiku-4.5"
            # Memory: shared agent-memory SSE service (see agent-memory.yaml).
            - name: PEPPERS_MEMORY_MCP_URL
              value: "http://agent-memory:8080/sse"
            # Neo4j — skill-recall + sleep-consolidation "minds" graph (same
            # instance as world/domain data).
            - name: GHOST_MINDS_NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: aie-matrix-secrets
                  key: NEO4J_URI
            - name: GHOST_MINDS_NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: aie-matrix-secrets
                  key: NEO4J_USER
            - name: GHOST_MINDS_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aie-matrix-secrets
                  key: NEO4J_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              # Node + PEPPERS_AGENT_COUNT concurrent ghost cognition loops.
              memory: 512Mi
            limits:
              memory: 1536Mi
