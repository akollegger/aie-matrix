# random-agent Kubernetes Deployment — ADR-0009, Spec 018
# Build context: repo root
# Usage:
#   docker build -f ghosts/random-agent/Dockerfile \
#     -t us-central1-docker.pkg.dev/aie-matrix/aie-matrix/random-agent:$(git rev-parse --short HEAD) .
#   docker push us-central1-docker.pkg.dev/aie-matrix/aie-matrix/random-agent:$(git rev-parse --short HEAD)
#   IMAGE_TAG=$(git rev-parse --short HEAD) envsubst < deploy/k8s/ghosts/random-agent.yaml \
#     | kubectl apply -n aie-matrix -f -
#
# Scale to N replicas: kubectl scale deployment/random-agent --replicas=N
# Each replica registers with a unique agentId (random-agent-<pod-name>).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: random-agent
  labels:
    app: random-agent
    tier: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: random-agent
  template:
    metadata:
      labels:
        app: random-agent
        tier: ghost
    spec:
      containers:
        - name: random-agent
          image: us-central1-docker.pkg.dev/aie-matrix/aie-matrix/random-agent:${IMAGE_TAG}
          ports:
            - containerPort: 4001
          env:
            # Agent-host ClusterIP service URL
            - name: AGENT_HOST_URL
              value: "http://agent-host:4000"
            # Token from the shared cluster secret (same value as agent-host's AGENT_HOST_TOKEN)
            - name: AGENT_HOST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aie-matrix-secrets
                  key: AGENT_HOST_TOKEN
            - name: AGENT_PORT
              value: "4001"
            # Pod IP via downward API — each replica gets a unique URL
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RANDOM_AGENT_PUBLIC_BASE_URL
              value: "http://$(MY_POD_IP):4001"
            # Pod name via downward API — becomes unique agentId suffix
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
