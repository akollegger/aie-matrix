replicaCount: 1

image:
  repository: us-central1-docker.pkg.dev/aie-matrix/aie-matrix/server
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8787

# Non-secret environment variables
env:
  NODE_ENV: production
  AIE_MATRIX_MODE: production
  AIE_MATRIX_HTTP_PORT: "8787"
  AIE_MATRIX_DEBUG: "false"
  AIE_MATRIX_MAP: "maps/moscone/moscone-aiewf-mini.map.gram"
  # Agent-host proxy: forwards /agent-host/* requests to the agent-host ClusterIP
  AGENT_HOST_URL: "http://agent-host:4000"
  # In-cluster MCP URL embedded in ghost credentials — must be reachable from agent-host + ghost pods.
  AIE_MATRIX_WORLD_API_MCP_URL: "http://server:8787/mcp"

# Name of the Kubernetes Secret created in Phase 3
secretName: aie-matrix-secrets

# Keys from the secret to inject as env vars
secretKeys:
  - NEO4J_URI
  - NEO4J_USER
  - NEO4J_PASSWORD
  - REDIS_URL
  - GCS_BUCKET
  - ADMIN_TOKEN
  - AGENT_HOST_TOKEN
  - AIE_MATRIX_INTERNAL_FANOUT_TOKEN

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 1Gi

autoscaling:
  # Colyseus uses in-memory rooms with no distributed presence (no RedisPresence wired).
  # Multiple replicas cause "room not found" on cross-pod WS connections. Keep at 1
  # until RedisPresence is wired in a future branch.
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 60
