replicaCount: 1

image:
  repository: us-central1-docker.pkg.dev/aie-matrix/aie-matrix/agent-host
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4000

# Non-secret environment variables
env:
  NODE_ENV: production
  AGENT_HOST_PORT: "4000"
  AGENT_HOST_PUBLIC_BASE_URL: "https://api.matrix.neo4j.gg"
  # Inter-service URLs — use Kubernetes Service DNS within the same namespace
  WORLD_API_URL: "http://server:8787"
  COLYSEUS_URL: "ws://server:8787"
  AIE_MATRIX_HTTP_BASE_URL: "http://server:8787"
  # Ephemeral catalog — agents self-register on startup, so /tmp starts empty
  # and is never stale from a baked-in catalog.json in the Docker image.
  CATALOG_FILE_PATH: "/tmp/catalog.json"
  # Reconciliation polling window — ghost pods need time to self-register after agent-host starts.
  # 120s gives ghost deployments ~2 min to come up and register before the window closes.
  AGENT_HOST_RECONCILIATION_WAIT_MS: "120000"
  # In-cluster URL for MCP + push-ingest endpoints sent to ghost agents in spawn contexts.
  # Must be directly reachable from agent pods (not through the external proxy which
  # swaps Authorization headers and doesn't forward mcpToken).
  AGENT_HOST_INTERNAL_BASE_URL: "http://agent-host:4000"

# Name of the Kubernetes Secret created in Phase 3
secretName: aie-matrix-secrets

# Keys from the secret to inject as env vars
secretKeys:
  - AGENT_HOST_TOKEN

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60
