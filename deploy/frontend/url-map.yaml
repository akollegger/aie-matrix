# Cloud Load Balancer URL map for aie-matrix front-ends
#
# Apply with:
#   gcloud compute url-maps import aie-matrix-frontend \
#     --source=deploy/frontend/url-map.yaml --global
#
# admin-paths points at admin-backend-service (global backend service backed by
# a Cloud Run serverless NEG). IAP is applied to admin-backend-service, not to
# a backend bucket — GCP does not support IAP on backend buckets.

name: aie-matrix-frontend
defaultService: https://www.googleapis.com/compute/v1/projects/aie-matrix/global/backendBuckets/intermedium-backend

hostRules:
  - hosts:
      - matrix.neo4j.gg
    pathMatcher: intermedium-paths
  - hosts:
      - admin.matrix.neo4j.gg
    pathMatcher: admin-paths

pathMatchers:
  - name: intermedium-paths
    defaultService: https://www.googleapis.com/compute/v1/projects/aie-matrix/global/backendBuckets/intermedium-backend
  - name: admin-paths
    defaultService: https://www.googleapis.com/compute/v1/projects/aie-matrix/global/backendServices/admin-backend-service
