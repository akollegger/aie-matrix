name: Staging Stack CI

on:
  workflow_dispatch:
  workflow_call:   # allows production-deploy.yml to gate on this job
  push:
    tags: ["v*"]

jobs:
  staging-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Unique project name per run — prevents volume/network conflicts on shared runners
      COMPOSE_PROJECT_NAME: aie-matrix-ci-${{ github.run_id }}
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-test-pw
      NEO4J_AUTH: neo4j/ci-test-pw
      # Redis
      REDIS_URL: redis://redis:6379
      # Combined server
      AIE_MATRIX_HTTP_PORT: "8787"
      AIE_MATRIX_INTERNAL_FANOUT_TOKEN: ""
      AIE_MATRIX_DEBUG: "false"
      ADMIN_TOKEN: ci-admin
      NODE_ENV: production
      # Agent Host
      AGENT_HOST_TOKEN: ci-test-token
      AGENT_HOST_PORT: "4000"
      AGENT_HOST_PUBLIC_BASE_URL: http://localhost:4000
      WORLD_API_URL: http://server:8787
      COLYSEUS_URL: ws://server:8787
      # Use file-backed maps so tests work without GCS
      AIE_MATRIX_MODE: development
      # Spawn all ghosts at map anchor cell for deterministic co-location tests
      AIE_MATRIX_TCK_MODE: "1"
      # Point npc-agent at the committed catalog (deploy/staging/catalog/ is empty by design).
      # Must start with ./ so Docker Compose treats it as a host path, not a named volume.
      # Path is relative to the compose file's directory (deploy/staging/), hence ../../.
      NPC_CATALOG_DIR: ../../ghosts/npc-agent/catalog

    steps:
      - uses: actions/checkout@v5

      - name: Build staging images
        run: docker compose -f deploy/staging/docker-compose.yml build

      - name: Start staging stack
        # depends_on: condition: service_healthy chains neo4j+redis → server → agent-host
        run: docker compose -f deploy/staging/docker-compose.yml up -d

      - name: Wait for agent-host healthy (up to 5 min)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health | grep -q '"status":"ok"'; then
              echo "Agent-host healthy after $((i * 10))s"
              exit 0
            fi
            echo "Waiting... attempt $i/30"
            sleep 10
          done
          echo "ERROR: agent-host did not become healthy within 5 minutes"
          exit 1

      - name: Assert server health
        run: |
          response=$(curl -sf http://localhost:8787/health)
          echo "$response"
          echo "$response" | grep -q '"status":"ok"'

      - name: Assert agent-host health
        run: |
          response=$(curl -sf http://localhost:4000/health)
          echo "$response"
          echo "$response" | grep -q '"status":"ok"'

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages required by TCK
        # These packages are compiled inside Docker images but not on the host runner.
        # Build them so the TCK and its pretest can find their dist/.
        run: |
          pnpm --filter @aie-matrix/shared-types run build
          pnpm --filter @aie-matrix/root-env run build
          pnpm --filter @aie-matrix/ghost-ts-client run build
          pnpm --filter @aie-matrix/map-gram run build

      - name: Test ghost autospawn (cold-start scenario)
        env:
          SERVER_URL: http://localhost:8787
          AGENT_HOST_URL: http://localhost:4000
          GHOST_MIN_COUNT: "1"
          WAIT_TIMEOUT_MS: "90000"
        run: node scripts/test-ghost-spawn.mjs

      - name: Run Ghost TCK (Contract Tests)
        env:
          AIE_MATRIX_REGISTRY_BASE: http://localhost:8787
          AIE_MATRIX_MCP_URL: http://localhost:8787/mcp
          AIE_MATRIX_TCK_MODE: "1"
        run: pnpm test:tck

      - name: Run integration tests (Neo4j-backed)
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ${{ env.NEO4J_PASSWORD }}
        run: pnpm --filter @aie-matrix/server-world-api test:integration

      - name: Run Playwright E2E Tests
        env:
          STAGING_STACK: "true"
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-test-pw
          AGENT_HOST_TOKEN: ci-test-token
          AIE_MATRIX_MCP_URL: http://localhost:8787/mcp
        run: pnpm test:e2e

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/staging/docker-compose.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f deploy/staging/docker-compose.yml down -v
