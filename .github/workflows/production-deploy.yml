name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. v1.0.0 or git SHA)"
        required: true
  push:
    branches: ["main"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT: aie-matrix
  REPO: aie-matrix
  REGION: us-central1
  CLUSTER: aie-matrix-prod
  NAMESPACE: aie-matrix

jobs:
  staging-gate:
    uses: ./.github/workflows/staging-ci.yml
    secrets: inherit

  build-push-deploy:
    needs: staging-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v5

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GCP via Workload Identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Show authenticated identity
        run: gcloud auth list

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up kubectl
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm -r build

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run linter
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm test

      # ── Build & push server image ──────────────────────────────────────────

      - name: Build server image
        run: |
          docker build \
            -f server/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.REPO }}/server:${{ steps.tag.outputs.value }} \
            .

      - name: Push server image
        run: docker push ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.REPO }}/server:${{ steps.tag.outputs.value }}

      # ── Build & push agent-host image ──────────────────────────────────────

      - name: Build agent-host image
        run: |
          docker build \
            -f server/agent-host/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.REPO }}/agent-host:${{ steps.tag.outputs.value }} \
            .

      - name: Push agent-host image
        run: docker push ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.REPO }}/agent-host:${{ steps.tag.outputs.value }}

      # ── Build & push random-agent image ────────────────────────────────────

      - name: Build random-agent image
        run: |
          docker build \
            -f ghosts/random-agent/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.REPO }}/random-agent:${{ steps.tag.outputs.value }} \
            .

      - name: Push random-agent image
        run: docker push ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.REPO }}/random-agent:${{ steps.tag.outputs.value }}

      # ── Build & push npc-agent image ───────────────────────────────────────

      - name: Build npc-agent image
        run: |
          docker build \
            -f ghosts/npc-agent/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.REPO }}/npc-agent:${{ steps.tag.outputs.value }} \
            .

      - name: Push npc-agent image
        run: docker push ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.REPO }}/npc-agent:${{ steps.tag.outputs.value }}

      # ── Build & push peppers-agent image ───────────────────────────────────

      - name: Build peppers-agent image
        run: |
          docker build \
            -f ghosts/peppers-agent/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.REPO }}/peppers-agent:${{ steps.tag.outputs.value }} \
            .

      - name: Push peppers-agent image
        run: docker push ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.REPO }}/peppers-agent:${{ steps.tag.outputs.value }}

      # ── Sync secrets into k8s ─────────────────────────────────────────────
      # GitHub Actions secrets are the source of truth. Patch the k8s secret
      # before Helm deploy so the server always uses the same ADMIN_TOKEN that
      # was baked into the map-editor client bundle.

      - name: Sync ADMIN_TOKEN to k8s secret
        env:
          VITE_ADMIN_TOKEN: ${{ secrets.VITE_ADMIN_TOKEN }}
        run: |
          kubectl patch secret aie-matrix-secrets \
            --namespace ${{ env.NAMESPACE }} \
            --type merge \
            -p "{\"data\":{\"ADMIN_TOKEN\":\"$(echo -n "$VITE_ADMIN_TOKEN" | base64 -w0)\"}}"

      # The agent-host chart's secretKeys changed from GHOST_HOUSE_DEV_TOKEN
      # (v0.2.7) to AGENT_HOST_TOKEN (018-ghost-agent-deployment). If the k8s
      # secret still only has the old key, pods get CreateContainerConfigError.
      # Copy the old key to the new name if AGENT_HOST_TOKEN is not yet present.
      - name: Migrate GHOST_HOUSE_DEV_TOKEN → AGENT_HOST_TOKEN in k8s secret
        run: |
          existing=$(kubectl get secret aie-matrix-secrets \
            --namespace ${{ env.NAMESPACE }} \
            -o jsonpath='{.data.AGENT_HOST_TOKEN}' 2>/dev/null || true)
          if [ -z "$existing" ]; then
            old=$(kubectl get secret aie-matrix-secrets \
              --namespace ${{ env.NAMESPACE }} \
              -o jsonpath='{.data.GHOST_HOUSE_DEV_TOKEN}' 2>/dev/null || true)
            if [ -n "$old" ]; then
              echo "Copying GHOST_HOUSE_DEV_TOKEN → AGENT_HOST_TOKEN"
              kubectl patch secret aie-matrix-secrets \
                --namespace ${{ env.NAMESPACE }} \
                --type merge \
                -p "{\"data\":{\"AGENT_HOST_TOKEN\":\"$old\"}}"
            else
              echo "ERROR: neither AGENT_HOST_TOKEN nor GHOST_HOUSE_DEV_TOKEN found in aie-matrix-secrets"
              exit 1
            fi
          else
            echo "AGENT_HOST_TOKEN already present — no migration needed"
          fi

      # ── Deploy via Helm ────────────────────────────────────────────────────

      - name: Deploy server
        run: |
          helm upgrade --install server deploy/k8s/charts/server \
            --namespace ${{ env.NAMESPACE }} \
            --set image.tag=${{ steps.tag.outputs.value }} \
            -f deploy/k8s/values-production.yaml \
            --wait \
            --timeout 8m

      # agent-host's pre-ee98b91 code hangs on SIGTERM (server.close() waits
      # for keep-alive connections indefinitely). GKE Autopilot does not appear
      # to honour terminationGracePeriodSeconds reliably for this workload, so
      # the pod can stay Terminating for the entire Helm --wait window.
      #
      # Fix: scale to 0 before the upgrade so there is no running pod for the
      # rolling-update to terminate. Helm then only waits for the new pod to
      # become Ready — no "Pending termination" possible. Once the new image
      # (25 s shutdown deadline, ee98b91) is live this step is idempotent:
      # scale-to-0 will succeed instantly against an already-empty replica set
      # and the wait command will be a no-op.
      - name: Deploy agent-host
        run: |
          # Drain existing pods so Helm sees no old replica to terminate.
          kubectl scale deployment/agent-host --replicas=0 \
            -n ${{ env.NAMESPACE }} 2>/dev/null || true
          # Wait up to 60 s; force-kill any pod that refuses to exit cleanly.
          kubectl wait pod \
            -l "app.kubernetes.io/name=agent-host" \
            -n ${{ env.NAMESPACE }} \
            --for=delete \
            --timeout=60s 2>/dev/null \
          || kubectl delete pod \
               -l "app.kubernetes.io/name=agent-host" \
               -n ${{ env.NAMESPACE }} \
               --force --grace-period=0 2>/dev/null || true

          # Now upgrade: no old pods → no rolling-update termination wait.
          helm upgrade --install agent-host deploy/k8s/charts/agent-host \
            --namespace ${{ env.NAMESPACE }} \
            --set image.tag=${{ steps.tag.outputs.value }} \
            -f deploy/k8s/values-production.yaml \
            --wait \
            --timeout 4m

      - name: Deploy random-agent
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          envsubst < deploy/k8s/ghosts/random-agent.yaml \
            | kubectl apply --namespace ${{ env.NAMESPACE }} -f -

      - name: Deploy npc-agent
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          envsubst < deploy/k8s/ghosts/npc-agent.yaml \
            | kubectl apply --namespace ${{ env.NAMESPACE }} -f -

      - name: Deploy peppers-agent
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          envsubst < deploy/k8s/ghosts/peppers-agent.yaml \
            | kubectl apply --namespace ${{ env.NAMESPACE }} -f -

      # ── Build & deploy front-ends ─────────────────────────────────────────

      - name: Build workspace deps for Intermedium
        run: |
          pnpm --filter @aie-matrix/root-env \
               --filter @aie-matrix/shared-types \
               --filter @aie-matrix/map-gram \
               --filter @aie-matrix/server-colyseus \
               build

      - name: Build Intermedium
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          [ -n "$VITE_API_BASE_URL" ] || { echo "ERROR: VITE_API_BASE_URL variable is not set"; exit 1; }
          pnpm --filter ./clients/intermedium build

      - name: Build Admin
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ADMIN_TOKEN: ${{ secrets.VITE_ADMIN_TOKEN }}
          # Agent-host is proxied through the world-api server at /agent-host/*.
          # VITE_AGENT_HOST_URL is derived from VITE_API_BASE_URL — no separate variable needed.
          # VITE_AGENT_HOST_BEARER reuses VITE_ADMIN_TOKEN: the proxy checks ADMIN_TOKEN then
          # forwards with AGENT_HOST_TOKEN server-side, keeping that token out of the browser bundle.
          VITE_AGENT_HOST_URL: ${{ vars.VITE_API_BASE_URL }}/agent-host
          VITE_AGENT_HOST_BEARER: ${{ secrets.VITE_ADMIN_TOKEN }}
        run: |
          [ -n "$VITE_API_BASE_URL" ] || { echo "ERROR: VITE_API_BASE_URL variable is not set"; exit 1; }
          [ -n "$VITE_ADMIN_TOKEN" ]  || echo "WARNING: VITE_ADMIN_TOKEN is not set — admin write ops will fail at runtime"
          pnpm --filter ./tools/map-editor build

      - name: Sync Intermedium to GCS
        run: gsutil -m rsync -r -d clients/intermedium/dist/ gs://aie-matrix-intermedium/

      - name: Sync Admin to GCS
        run: gsutil -m rsync -r -d tools/map-editor/dist/ gs://aie-matrix-admin/

      - name: Build admin-nginx image
        run: |
          docker build \
            -f deploy/frontend/nginx-admin/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.REPO }}/admin-nginx:${{ steps.tag.outputs.value }} \
            deploy/frontend/nginx-admin/

      - name: Push admin-nginx image
        run: docker push ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.REPO }}/admin-nginx:${{ steps.tag.outputs.value }}

      - name: Update admin-frontend Cloud Run
        run: |
          gcloud run deploy admin-frontend \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.REPO }}/admin-nginx:${{ steps.tag.outputs.value }} \
            --region=${{ env.REGION }} \
            --service-account=admin-frontend-sa@${{ env.PROJECT }}.iam.gserviceaccount.com \
            --project=${{ env.PROJECT }}

      - name: Invalidate Intermedium CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache aie-matrix-frontend \
            --path "/*" \
            --host matrix.neo4j.gg \
            --async

      # ── Verify ────────────────────────────────────────────────────────────

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/server -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/agent-host -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/random-agent -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/npc-agent -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/peppers-agent -n ${{ env.NAMESPACE }}

      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl logs -l app.kubernetes.io/name=server -n ${{ env.NAMESPACE }} --tail=50 || true
          kubectl logs -l app.kubernetes.io/name=agent-host -n ${{ env.NAMESPACE }} --tail=50 || true
          kubectl logs -l app=random-agent -n ${{ env.NAMESPACE }} --tail=50 || true
          kubectl logs -l app=npc-agent -n ${{ env.NAMESPACE }} --tail=50 || true
          kubectl logs -l app=peppers-agent -n ${{ env.NAMESPACE }} --tail=50 || true
